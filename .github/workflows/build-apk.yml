name: Build All-in-One APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed All-in-One Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Client Source Zip
        id: cache-client-source
        uses: actions/cache@v4
        with:
          path: src.zip
          key: client-source-v1.0-37cb6f9df6a4a7af0252fa76137f7e8b3d5c6cf3c2ec8f9d8e12816caf6a689a

      - name: Download and Unpack Client Source
        run: |
          if [ ! -f src.zip ]; then
            echo "[*] Downloading Source.Code.Samp.v1.2.zip..."
            curl -fL -o src.zip https://github.com/tohbobo51/CLIENT-TESTING/releases/download/v1.0/Source.Code.Samp.v1.2.zip
          fi
          echo "37cb6f9df6a4a7af0252fa76137f7e8b3d5c6cf3c2ec8f9d8e12816caf6a689a  src.zip" | sha256sum -c -
          rm -rf client
          unzip -q src.zip -d client

      - name: Cache Game Data Zips
        id: cache-game-data
        uses: actions/cache@v4
        with:
          path: ~/.cache/samp-game-data
          key: game-data-v1-e06ce14e8e8ebc4bcb246aa57d9c2efdbcc99b728975fe8de962e99ad7e9c218-4854d4176df5a8da3da17bf4aaf58e374c395ab0e1cb68be0a83ab0f6889c7ec

      - name: Fetch and Verify Bundled Game Data
        run: |
          mkdir -p ~/.cache/samp-game-data
          cd ~/.cache/samp-game-data

          if [ ! -f gtasa.2.10.cache.zip ]; then
            echo "[*] Downloading gtasa.2.10.cache.zip..."
            curl -fL -o gtasa.2.10.cache.zip https://github.com/tohbobo51/samp-game-data/releases/download/v1.0/gtasa.2.10.cache.zip
          fi

          if [ ! -f CRMP.zip ]; then
            echo "[*] Downloading CRMP.zip..."
            curl -fL -o CRMP.zip https://github.com/tohbobo51/samp-game-data/releases/download/v1.0/CRMP.zip
          fi

          echo "e06ce14e8e8ebc4bcb246aa57d9c2efdbcc99b728975fe8de962e99ad7e9c218  gtasa.2.10.cache.zip" | sha256sum -c -
          echo "4854d4176df5a8da3da17bf4aaf58e374c395ab0e1cb68be0a83ab0f6889c7ec  CRMP.zip" | sha256sum -c -

          cd "$GITHUB_WORKSPACE"
          mkdir -p client/game-data/game_data
          cp ~/.cache/samp-game-data/gtasa.2.10.cache.zip client/game-data/game_data/
          cp ~/.cache/samp-game-data/CRMP.zip client/game-data/game_data/
          echo "[*] Game data assets placed into client/game-data/game_data/"

      - name: Apply Base CEF and Server Configuration
        run: |
          python3 scripts/prepare_client.py client

      - name: Synchronize Custom UI Drawables
        run: |
          if [ -d "res/drawable-nodpi" ]; then
            echo "[*] Syncing custom drawables from repo..."
            mkdir -p client/app/src/main/res/drawable-nodpi
            cp -r res/drawable-nodpi/* client/app/src/main/res/drawable-nodpi/
          fi

      - name: Apply Single-Server Lock, Asset Extractor, and Orientation Patches
        run: |
          python3 scripts/patch_single_server.py client

      - name: Optimize PNG Drawables to WebP
        run: |
          sudo apt-get update -y && sudo apt-get install -y webp
          python3 scripts/optimize_drawables.py client

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore and Environment
        run: |
          mkdir -p client/app
          KEYSTORE_FILE_PATH="$GITHUB_WORKSPACE/client/app/release.keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "[*] Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE_PATH"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "[*] Generating fallback release keystore..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE_PATH" -alias viceside \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass vicesidepass -keypass vicesidepass \
              -dname "CN=ViceSide, OU=Client, O=Roleplay, L=City, S=State, C=ID"
            echo "KEYSTORE_PASSWORD=vicesidepass" >> $GITHUB_ENV
            echo "KEY_ALIAS=viceside" >> $GITHUB_ENV
            echo "KEY_PASSWORD=vicesidepass" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE_PATH" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV

      - name: Build Signed Release APK
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Integrity and Badging
        run: |
          APK_PATH=$(find client/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "[-] ERROR: Release APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

          # Android build-tools
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "=== 1. Package and Orientation Verification ==="
          $AAPT dump badging "$APK_PATH" | grep "package: name='com.xyron.game'"
          $AAPT dump badging "$APK_PATH" | grep "screenOrientation='landscape'"

          echo "=== 2. Native Library Verification (armeabi-v7a only) ==="
          unzip -l "$APK_PATH" | grep "lib/armeabi-v7a/libGTASA.so"
          unzip -l "$APK_PATH" | grep "lib/armeabi-v7a/libomp_component_"

          echo "=== 3. Bundled Game Data Asset Verification ==="
          unzip -l "$APK_PATH" | grep "assets/game_data/gtasa.2.10.cache.zip"
          unzip -l "$APK_PATH" | grep "assets/game_data/CRMP.zip"

          echo "=== 4. Signature Verification ==="
          $APKSIGNER verify --verbose "$APK_PATH"

          echo "=== 5. APK Size and SHA256 ==="
          ls -lh "$APK_PATH"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          sha256sum "$APK_PATH" > "${APK_PATH}.sha256"
          cat "${APK_PATH}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viceside-all-in-one-apk
          path: |
            client/app/build/outputs/apk/release/*.apk
            client/app/build/outputs/apk/release/*.sha256
          if-no-files-found: error

      - name: Evaluate Release Upload Strategy
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MAX_GH_ASSET_SIZE=2147483648 # 2 GiB limit
          if [ "$APK_SIZE" -le "$MAX_GH_ASSET_SIZE" ]; then
            echo "ALLOW_GH_RELEASE=true" >> $GITHUB_ENV
            echo "[+] APK size ($APK_SIZE bytes) is within 2 GiB GitHub Release limit."
          else
            echo "ALLOW_GH_RELEASE=false" >> $GITHUB_ENV
            echo "[!] APK size ($APK_SIZE bytes) exceeds 2 GiB limit. Offloading..."
            if [ -n "${{ secrets.RELEASE_UPLOAD_URL }}" ]; then
              echo "[*] Uploading APK to external host..."
              curl -f -X POST -F "file=@$APK_PATH" "${{ secrets.RELEASE_UPLOAD_URL }}"
            else
              echo "[!] Warning: RELEASE_UPLOAD_URL secret is not set."
            fi
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.ALLOW_GH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Vice Side Mobile All-in-One Client (${{ github.ref_name }})"
          draft: false
          prerelease: false
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          body: |
            ### Vice Side Roleplay — All-in-One Android Client

            - **Versi:** `${{ github.ref_name }}`
            - **Server:** `142.132.203.47:10125` (Terkunci)
            - **Arsitektur:** `armeabi-v7a` (32-bit)
            - **Otentikasi UCP:** Google Auth melalui in-game CEF browser terintegrasi
            - **Instalasi:** Seluruh data GTA SA dan CRMP telah dibundel di dalam APK. Ekstraksi otomatis berjalan saat pertama kali aplikasi dibuka tanpa perlu mengunduh file tambahan dari internet.
